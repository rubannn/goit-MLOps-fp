apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minio
  namespace: mlops-system
spec:
  project: default
  source:
    repoURL: registry-1.docker.io/bitnamicharts
    chart: minio
    targetRevision: 17.0.21
    helm:
      values: |
        image:
          repository: bitnamilegacy/minio
        auth:
          # Real credentials live only in the "minio-credentials" Secret,
          # created once via `kubectl create secret` during bootstrap (see
          # README.md) — never committed to git. See THREAT_MODEL.md / ADR.md.
          existingSecret: minio-credentials
          rootUserSecretKey: root-user
          rootPasswordSecretKey: root-password
        defaultBuckets: "mlflow-artifacts"
        service:
          type: ClusterIP
        console:
          enabled: false
        persistence:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: mlops-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
